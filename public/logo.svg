<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Monogram Crest -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal / Jewel Outer Frame -->
    <polygon points="40,2 78,22 78,62 40,82 2,62 2,22" fill="#041712" stroke="url(#logoGoldGrad)" stroke-width="2"/>
    <polygon points="40,6 74,24 74,60 40,78 6,60 6,24" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-dasharray="2 2"/>
    
    <!-- Central Monogram KJ -->
    <path d="M28 26 L28 54 M28 40 L44 26 M34 35 L46 54" stroke="url(#logoGoldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 26 L52 48 C52 53 48 56 44 54" stroke="url(#logoGoldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top Crown / Jewel Sparkle -->
    <polygon points="40,11 44,18 36,18" fill="#F5EED8"/>
    <circle cx="40" cy="10" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(105, 20)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', serif" font-size="25" font-weight="700" letter-spacing="4.5" fill="url(#logoGoldGrad)">
      KANCHAN
    </text>
    <text x="0" y="52" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="500" letter-spacing="6" fill="#F5EED8">
      JEWELLERS
    </text>
    
    <!-- Tagline / Location Accent -->
    <line x1="0" y1="62" x2="270" y2="62" stroke="#C5A059" stroke-width="0.75" opacity="0.6"/>
    <text x="0" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.5" fill="#B08B42">
      DARI • DHARAMSHALA • EST. 916 GOLD
    </text>
  </g>

  <defs>
    <linearGradient id="logoGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF8E2"/>
      <stop offset="35%" stop-color="#E5C368"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6E31"/>
    </linearGradient>
  </defs>
</svg>
