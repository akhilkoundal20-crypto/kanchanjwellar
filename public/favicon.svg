<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#041712"/>
  <rect x="5" y="5" width="90" height="90" rx="20" stroke="#C5A059" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Diamond / Jewel Motif -->
  <polygon points="50,18 78,38 50,82 22,38" fill="url(#goldGrad)" stroke="#EBDCB1" stroke-width="1.5"/>
